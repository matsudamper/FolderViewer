name: Release APK

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: write
    env:
      DEBUG_KEYSTORE_FILE: debug.keystore
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Determine VERSION
        id: version
        env:
          BASE_VERSION: ${{ vars.VERSION }}
        run: |
          if [ -n "$BASE_VERSION" ] && ! [[ "$BASE_VERSION" =~ ^[0-9]+$ ]]; then
            echo "Error: VERSION must be a non-negative integer, got: $BASE_VERSION"
            exit 1
          fi

          BASE_VERSION=${BASE_VERSION:-0}
          LATEST_TAG_VERSION=$(git tag --list 'Release-*' | sed -n 's/^Release-\([0-9][0-9]*\)$/\1/p' | sort -n | tail -1)
          LATEST_TAG_VERSION=${LATEST_TAG_VERSION:-0}

          if [ "$LATEST_TAG_VERSION" -gt "$BASE_VERSION" ]; then
            BASE_VERSION=$LATEST_TAG_VERSION
          fi

          VERSION=$((BASE_VERSION + 1))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Build Release APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew assembleRelease

      - name: Zip Release APK
        run: |
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          zip -j "${APK_SRC%.apk}.zip" "$APK_SRC"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: Release-${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: app/build/outputs/apk/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
