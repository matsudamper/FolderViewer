name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      DEBUG_KEYSTORE_FILE: debug.keystore

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore

      - name: Build debug APKs
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p ci-apks
          SHORT_SHA="${GITHUB_SHA:0:7}"
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          BASE_NAME="app-${SAFE_REPO}-${SAFE_BRANCH}-${SHORT_SHA}"

          VERSION_CODE=111 ./gradlew clean assembleDebug ktlintCheck detekt
          APK_111_NAME="${BASE_NAME}-vc111.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "ci-apks/${APK_111_NAME}"

          VERSION_CODE=1 ./gradlew clean assembleDebug
          APK_1_NAME="${BASE_NAME}-vc1.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "ci-apks/${APK_1_NAME}"

          echo "APK_111_NAME=${APK_111_NAME}" >> "$GITHUB_ENV"
          echo "APK_111_PATH=ci-apks/${APK_111_NAME}" >> "$GITHUB_ENV"
          echo "APK_1_NAME=${APK_1_NAME}" >> "$GITHUB_ENV"
          echo "APK_1_PATH=ci-apks/${APK_1_NAME}" >> "$GITHUB_ENV"

      - name: Upload versionCode 111 APK
        id: upload_apk_111
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_111_NAME }}
          path: ${{ env.APK_111_PATH }}

      - name: Upload versionCode 1 APK
        id: upload_apk_1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APK_1_NAME }}
          path: ${{ env.APK_1_PATH }}

      - name: Compress APKs for S3 upload
        if: github.event_name == 'pull_request'
        run: |
          xz -0 -c "$APK_111_PATH" > "$APK_111_PATH.xz"
          xz -0 -c "$APK_1_PATH" > "$APK_1_PATH.xz"
          echo "S3_APK_111_PATH=${APK_111_PATH}.xz" >> "$GITHUB_ENV"
          echo "S3_APK_1_PATH=${APK_1_PATH}.xz" >> "$GITHUB_ENV"

      - name: Upload versionCode 111 APK to S3
        if: github.event_name == 'pull_request'
        id: upload_s3_111
        uses: matsudamper/actions/upload-matsudamper-s3@a1ecf81b1a0ce320824a49711e456f396e4e8fea # v1.0.0
        continue-on-error: true
        with:
          file_path: ${{ env.S3_APK_111_PATH }}

      - name: Upload versionCode 1 APK to S3
        if: github.event_name == 'pull_request'
        id: upload_s3_1
        uses: matsudamper/actions/upload-matsudamper-s3@a1ecf81b1a0ce320824a49711e456f396e4e8fea # v1.0.0
        continue-on-error: true
        with:
          file_path: ${{ env.S3_APK_1_PATH }}

      - name: Generate GitHub QR codes
        if: github.event_name == 'pull_request'
        run: |
          pip install "qrcode[pil]" --quiet
          python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-github-111.png')" "${{ steps.upload_apk_111.outputs.artifact-url }}"
          python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-github-1.png')" "${{ steps.upload_apk_1.outputs.artifact-url }}"

      - name: Upload versionCode 111 GitHub QR artifact
        if: github.event_name == 'pull_request'
        id: github_qr_artifact_111
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-qr-code-github-vc111
          path: qrcode-github-111.png
          archive: false

      - name: Upload versionCode 1 GitHub QR artifact
        if: github.event_name == 'pull_request'
        id: github_qr_artifact_1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-qr-code-github-vc1
          path: qrcode-github-1.png
          archive: false

      - name: Generate S3 QR codes
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "${{ steps.upload_s3_111.outputs.url }}" ]; then
            python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-s3-111.png')" "${{ steps.upload_s3_111.outputs.url }}"
          fi
          if [ -n "${{ steps.upload_s3_1.outputs.url }}" ]; then
            python3 -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-s3-1.png')" "${{ steps.upload_s3_1.outputs.url }}"
          fi

      - name: Upload versionCode 111 S3 QR artifact
        if: github.event_name == 'pull_request' && steps.upload_s3_111.outputs.url != ''
        id: s3_qr_artifact_111
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-qr-code-s3-vc111
          path: qrcode-s3-111.png
          archive: false

      - name: Upload versionCode 1 S3 QR artifact
        if: github.event_name == 'pull_request' && steps.upload_s3_1.outputs.url != ''
        id: s3_qr_artifact_1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apk-qr-code-s3-vc1
          path: qrcode-s3-1.png
          archive: false

      - name: Comment APK download URLs
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: apk-download
          recreate: true
          message: |
            ✅ **Debug APKs are ready!**
            | versionCode | Storage | 圧縮方式 | Download Link | QR Code |
            | ---: | :--- | :--- | :--- | :--- |
            | 111 | 🐙 GitHub Artifacts | zip | [Download](${{ steps.upload_apk_111.outputs.artifact-url }}) | [View](${{ steps.github_qr_artifact_111.outputs.artifact-url }}) |
            ${{ steps.upload_s3_111.outputs.url && format('| 111 | ☁️ S3 | xz | [Download]({0}) | [View]({1}) |', steps.upload_s3_111.outputs.url, steps.s3_qr_artifact_111.outputs.artifact-url) || format('| 111 | ☁️ S3 | - | ⚠️ アップロード失敗 ([run]({0}/{1}/actions/runs/{2})) | - |', github.server_url, github.repository, github.run_id) }}
            | 1 | 🐙 GitHub Artifacts | zip | [Download](${{ steps.upload_apk_1.outputs.artifact-url }}) | [View](${{ steps.github_qr_artifact_1.outputs.artifact-url }}) |
            ${{ steps.upload_s3_1.outputs.url && format('| 1 | ☁️ S3 | xz | [Download]({0}) | [View]({1}) |', steps.upload_s3_1.outputs.url, steps.s3_qr_artifact_1.outputs.artifact-url) || format('| 1 | ☁️ S3 | - | ⚠️ アップロード失敗 ([run]({0}/{1}/actions/runs/{2})) | - |', github.server_url, github.repository, github.run_id) }}
